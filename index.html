<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wowo's Photocards</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Gowun+Dodum&display=swap">
<style>
  /* Layout: one photocard in a toploader, resting on an empty binder page. It flips to the pull. */
  :root {
    --binder: #f7bdd3;
    --pocket: #fbd5e3;
    --ink: #2e1233;
    --sleeve: #fffafc;
    --hot: #e0246f;
    --yolk: #ffc928;
    --sky: #bfe8f5;
    --display: "Bagel Fat One", "Arial Rounded MT Bold", system-ui, sans-serif;
    --body: "Gowun Dodum", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding-block: 24px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid;
    place-items: center;
    overflow-x: hidden;
    color: var(--ink);
    font: 16px/1.4 var(--body);
    background-color: var(--binder);
    background-image:
      linear-gradient(var(--pocket), var(--pocket));
    background-image:
      repeating-linear-gradient(90deg, transparent 0 12px, var(--pocket) 12px 168px, transparent 168px 180px),
      repeating-linear-gradient(0deg, var(--binder) 0 12px, transparent 12px 252px);
    background-blend-mode: normal;
  }
  .flip { width: min(340px, 100%); perspective: 1400px; }
  .inner {
    display: grid;
    transform-style: preserve-3d;
    transition: transform 0.8s cubic-bezier(0.3, 1.3, 0.5, 1);
  }
  .flipped .inner { transform: rotateY(180deg); }
  .face {
    grid-area: 1 / 1;
    display: flex;
    flex-direction: column;
    gap: 18px;
    min-height: 490px;
    padding: 22px;
    background: var(--sleeve);
    border: 3px solid var(--ink);
    border-radius: 14px;
    box-shadow: 8px 8px 0 var(--ink);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .back { transform: rotateY(180deg); }
  .tag {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  h1 {
    flex: 1;
    display: flex;
    align-items: center;
    margin: 0;
    color: var(--hot);
    font: 400 clamp(46px, 13vw, 58px)/1.04 var(--display);
    text-wrap: balance;
  }
  .slot { height: 60px; }
  button {
    min-height: 60px;
    padding: 0 22px;
    border: 3px solid var(--ink);
    border-radius: 999px;
    background: var(--yolk);
    color: var(--ink);
    font: 400 21px var(--display);
    white-space: nowrap;
    cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--hot); outline-offset: 3px; }
  #claim { width: 100%; }
  #claim.running {
    position: fixed;
    z-index: 5;
    width: auto;
    box-shadow: 4px 4px 0 var(--ink);
    transition: left 0.22s ease-out, top 0.22s ease-out;
  }
  #claim[hidden] { display: none; }
  .photo { flex: 1; min-height: 0; border: 3px solid var(--ink); border-radius: 8px; background: var(--sky); }
  .photo svg { display: block; width: 100%; height: 100%; }
  .back h2 { margin: 0; font: 400 28px/1.1 var(--display); color: var(--hot); }
  .back p { margin: 0; }
  #again { background: var(--sleeve); min-height: 48px; font-size: 17px; }
  @media (prefers-reduced-motion: reduce) {
    .inner, #claim.running { transition: none; }
  }
</style>
</head>
<body>
<div class="flip" id="flip">
  <div class="inner">
    <section class="face front" id="front">
      <div class="tag"><span>Photocard voucher</span><span>No. 001</span></div>
      <h1>wowo buy you many photocards</h1>
      <div class="slot"><button id="claim" type="button">Claim photocards</button></div>
    </section>

    <section class="face back" id="back" inert>
      <div class="tag"><span>Your pull</span><span>Ver. Bawk</span></div>
      <div class="photo">
        <svg viewBox="0 0 280 240" role="img" aria-label="A round white chicken with a red comb, looking very pleased">
          <ellipse cx="140" cy="218" rx="86" ry="9" fill="#8fcbdd"/>
          <path d="M122 190v22m-11 1h22M162 190v22m-11 1h22" fill="none" stroke="#f08a1d" stroke-width="6" stroke-linecap="round"/>
          <path d="M62 112c-22-8-32-30-26-46 10 8 18 8 28 16 2-12 12-20 22-20z" fill="#fff" stroke="#2e1233" stroke-width="4" stroke-linejoin="round"/>
          <ellipse cx="136" cy="130" rx="84" ry="68" fill="#fff" stroke="#2e1233" stroke-width="4"/>
          <path d="M172 54c2-14 14-16 16-4 6-12 20-10 18 4 12-4 18 10 8 18l-40 2z" fill="#e4322b" stroke="#2e1233" stroke-width="4" stroke-linejoin="round"/>
          <path d="M156 130c-4-44 10-68 38-68 26 0 38 22 34 50-3 24-20 40-40 40-16 0-30-8-32-22z" fill="#fff"/>
          <path d="M156 92c8-22 20-30 38-30 26 0 38 22 34 50" fill="none" stroke="#2e1233" stroke-width="4" stroke-linecap="round"/>
          <circle cx="200" cy="92" r="7" fill="#2e1233"/>
          <circle cx="202.500" cy="89.500" r="2.200" fill="#fff"/>
          <path d="M226 98l26 11-27 10z" fill="#ffc928" stroke="#2e1233" stroke-width="4" stroke-linejoin="round"/>
          <path d="M219 122c8 3 10 18 1 21-9 2-12-12-7-20z" fill="#e4322b" stroke="#2e1233" stroke-width="4" stroke-linejoin="round"/>
          <path d="M88 124c26-8 54 2 56 20-8 26-44 28-60 8-6-10-4-22 4-28z" fill="#ffeef4" stroke="#2e1233" stroke-width="4" stroke-linejoin="round"/>
          <ellipse cx="184" cy="112" rx="10" ry="6" fill="#f7bdd3"/>
        </svg>
      </div>
      <h2>One (1) chicken</h2>
      <p>Ultra rare. Condition: near mint. No refunds.</p>
      <button id="again" type="button">Try again</button>
    </section>
  </div>
</div>

<script>
  const claim = document.getElementById('claim');
  const again = document.getElementById('again');
  const flip = document.getElementById('flip');
  const front = document.getElementById('front');
  const back = document.getElementById('back');

  const MOUSE_DODGES = 9;
  const TOUCH_DODGES = 4;
  const FLEE_RADIUS = 120;
  const TAUNTS = ['Nope', 'Too slow', 'Almost', 'Not today', 'Try harder', 'So close', 'Hehe', 'Ok last one'];
  let dodges = 0;

  function pointerGap(x, y, left, top, rect) {
    return Math.hypot(x - (left + rect.width / 2), y - (top + rect.height / 2));
  }

  function dodge(x, y) {
    dodges += 1;
    claim.textContent = TAUNTS[(dodges - 1) % TAUNTS.length];
    const start = claim.getBoundingClientRect();
    if (!claim.classList.contains('running')) {
      claim.style.left = `${start.left}px`;
      claim.style.top = `${start.top}px`;
      claim.classList.add('running');
      claim.getBoundingClientRect();
    }
    const rect = claim.getBoundingClientRect();
    const maxLeft = Math.max(16, innerWidth - rect.width - 16);
    const maxTop = Math.max(16, innerHeight - rect.height - 16);
    const reach = Math.min(240, Math.hypot(maxLeft, maxTop) / 2);
    let left = 16;
    let top = 16;
    for (let i = 0; i < 30; i++) {
      left = 16 + Math.random() * (maxLeft - 16);
      top = 16 + Math.random() * (maxTop - 16);
      if (pointerGap(x, y, left, top, rect) > reach) break;
    }
    claim.style.left = `${left}px`;
    claim.style.top = `${top}px`;
  }

  function giveUp() {
    claim.textContent = 'Ok fine, click';
  }

  document.addEventListener('pointermove', (event) => {
    if (event.pointerType !== 'mouse' || flip.classList.contains('flipped')) return;
    if (dodges >= MOUSE_DODGES) return giveUp();
    const rect = claim.getBoundingClientRect();
    if (pointerGap(event.clientX, event.clientY, rect.left, rect.top, rect) < FLEE_RADIUS) {
      dodge(event.clientX, event.clientY);
    }
  });

  claim.addEventListener('pointerdown', (event) => {
    if (event.pointerType === 'mouse') return;
    if (dodges < TOUCH_DODGES) dodge(event.clientX, event.clientY);
    else giveUp();
  });

  claim.addEventListener('click', () => {
    claim.hidden = true;
    flip.classList.add('flipped');
    front.inert = true;
    back.inert = false;
    again.focus({ preventScroll: true });
  });

  again.addEventListener('click', () => {
    dodges = 0;
    claim.hidden = false;
    claim.classList.remove('running');
    claim.removeAttribute('style');
    claim.textContent = 'Claim photocards';
    flip.classList.remove('flipped');
    back.inert = true;
    front.inert = false;
  });
</script>
</body>
</html>
